name: Deploy GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static files
        run: |
          mkdir -p dist
          shopt -s extglob
          cp -r index.html style.css app.js tests.html dist/ 2>/dev/null || true
          # Include any other assets in root except git/CI files
          for f in *; do
            case "$f" in
              .git|.github|node_modules|dist) ;;
              *.md|*.txt|*.png|*.jpg|*.svg|*.ico|*.webmanifest) cp -r "$f" dist/ 2>/dev/null || true ;;
            esac
          done
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハナハナ風スロット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">ハナハナ風スロット</h1>
    <div class="settings">
      <button
        id="themeToggle"
        class="icon-button"
        aria-label="ダークモード切り替え"
        aria-pressed="false"
      >🌙</button>
      <button
        id="soundToggle"
        class="icon-button"
        aria-label="サウンド切り替え"
        aria-pressed="true"
      >🔊</button>
    </div>
  </header>

  <main class="slot-container">
    <div class="hibiscus-side" id="hibiscus"></div>

    <div class="slot-machine">
      <div id="reel0" class="reel"></div>
      <div id="reel1" class="reel"></div>
      <div id="reel2" class="reel"></div>
    </div>

    <div class="hibiscus-side" id="hibiscus-right"></div>
  </main>

  <div class="controls">
    <button id="spinButton" aria-label="スピン">スピン</button>
    <button id="undoButton" aria-label="前回を取り消す" disabled>取り消し</button>
    <button id="resetButton" aria-label="ゲームをリセット">リセット</button>
  </div>

  <div id="message" class="message" role="status" aria-live="polite"></div>
  <div id="coinDisplay" class="message" aria-live="polite">残高：100枚</div>

  <script src="app.js"></script>
</body>
</html>

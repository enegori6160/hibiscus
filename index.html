<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ハナハナ風スロット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slot-container">
    <div class="hibiscus-side" id="hibiscus"></div>

    <div class="slot-machine">
      <div id="reel0" class="reel"></div>
      <div id="reel1" class="reel"></div>
      <div id="reel2" class="reel"></div>
    </div>

    <div class="hibiscus-side" id="hibiscus-right"></div>
  </div>

  <button id="spinButton">スピン</button>
  <div id="message" class="message"></div>
  <div id="coinDisplay" class="message">残高：100枚</div>

  <script src="app.js"></script>
</body>
</html>

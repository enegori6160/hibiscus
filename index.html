<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヘナヘナ</title>
  <link rel="icon" href="data:,">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="style.css?v=20260310-4">
</head>
  <body>
    <main class="app-main" id="game" tabindex="-1">
    <section class="game-panel" aria-labelledby="gameHeading">
      <h1 id="gameHeading" class="sr-only">ゲーム</h1>
      <div class="slot-container">
        <div class="top-hud" aria-label="台データ">
          <div class="credit-panel" aria-live="polite">
            <div class="credit-label" aria-hidden="true">CREDIT</div>
            <div id="coinDisplayTop" class="digit-display">100</div>
          </div>
          <div class="meter-panel">
            <div class="meter-box">
              <div class="meter-label">回転数</div>
              <div id="statCurrent" class="digit-small">0</div>
            </div>
            <div class="meter-box">
              <div class="meter-label">総回転数</div>
              <div id="statTotal" class="digit-small">0</div>
            </div>
            <div class="meter-box">
              <div class="meter-label red">BIG</div>
              <div id="statBIG" class="digit-small red">0</div>
            </div>
            <div class="meter-box">
              <div class="meter-label orange">REG</div>
              <div id="statREG" class="digit-small orange">0</div>
            </div>
            <div class="meter-box">
              <div class="meter-label cyan">F</div>
              <div id="statSP" class="digit-small cyan">0</div>
            </div>
          </div>
        </div>
        <div class="reel-frame" role="group" aria-label="リールウィンドウ">
          <div class="hibiscus-side wave-a" id="hibiscus" aria-hidden="true"></div>
          <div class="slot-machine" role="group" aria-label="スロットリール">
            <div id="reel0" class="reel" aria-label="リール1"></div>
            <div id="reel1" class="reel" aria-label="リール2"></div>
            <div id="reel2" class="reel" aria-label="リール3"></div>
          </div>
          <div class="hibiscus-side wave-b" id="hibiscus-right" aria-hidden="true"></div>
        </div>
      </div>

      <div class="cabinet-panel" role="group" aria-label="操作パネル">
        <div class="panel-left">
          <button id="betButton" class="bet">BET</button>
          <div class="meter"><span>BET：</span><strong id="betCount">0</strong></div>
        </div>
        <div class="panel-center">
          <button id="stop0" class="stop" aria-label="左停止">●</button>
          <button id="stop1" class="stop" aria-label="中停止">●</button>
          <button id="stop2" class="stop" aria-label="右停止">●</button>
        </div>
        <div class="panel-right">
          <button id="lever" class="lever joystick" aria-label="レバー">
            <span class="lever-base" aria-hidden="true"></span>
            <span class="lever-stick" aria-hidden="true"></span>
            <span class="lever-ball" aria-hidden="true"></span>
            <span class="sr-only">レバー</span>
          </button>
        </div>
      </div>

      <div class="controls" role="group" aria-label="操作ボタン">
        <button id="spinButton" aria-label="スピンする" class="primary" style="display:none">スピン</button>
        <button id="undoButton" aria-label="直前の操作を取り消す" disabled>取り消し</button>
        <button id="resetButton" aria-label="ゲームをリセット">リセット</button>
      </div>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div id="coinDisplay" class="coin" aria-live="polite">所持コイン：100枚</div>
    </section>

    <section class="settings-panel" aria-labelledby="settingsHeading" id="settings">
      <h2 id="settingsHeading">設定</h2>
      <div class="settings-grid">
        <div class="setting-item">
          <div class="setting-label">テーマ</div>
          <div class="setting-control"><button id="themeToggle2" class="button-like">ライト/ダーク切替</button></div>
        </div>
        <div class="setting-item">
          <div class="setting-label">サウンド</div>
          <div class="setting-control"><button id="soundToggle2" class="button-like">オン/オフ</button></div>
        </div>
        <div class="setting-item">
          <div class="setting-label">設定</div>
          <div class="setting-control">
            <label for="settingSelect" class="sr-only">設定（1〜6）</label>
            <select id="settingSelect" class="select-like" aria-label="設定を選択">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">超高確率モード</option>
            </select>
          </div>
        </div>
      </div>
    </section>
    <section class="side-panel quests-panel" aria-labelledby="questsHeading" id="questsPanel">
      <h2 id="questsHeading">クエスト</h2>
      <ul id="questsList" class="quests-list"></ul>
    </section>

    <aside class="side-panel" aria-labelledby="howtoHeading" id="howto">
      <h2 id="howtoHeading">遊び方</h2>
      <ul class="howto-list">
        <li>配当：BIG +350枚、REG +120枚。</li>
        <li>ランプ：BIG時は通常に加え、BIG確定の16種類の点灯パターンがあります。フリーズもあるかも…??</li>
        <li>設定：1〜5は通常確率、6は超高確率モード</li>
      </ul>
    </aside>
  </main>

  <div id="endingOverlay" class="ending-overlay" hidden>
    <div class="credits">
      <p class="congrats">🎊Congratulations！🎊</p>
      <p class="developer-credit">開発者：enegori</p>
    </div>
  </div>

  <footer class="app-footer" role="contentinfo">
    <small>© 2025 Hanahana Slot</small>
    <small class="developer-credit">devenegori</small>
  </footer>

  <script src="./premium-fx.js"></script>
  <script>premiumFx.mount();</script>
  <script src="ad-config.js?v=20260310-4"></script>
  <script src="ad-system.js?v=20260310-4"></script>
  <script src="ad-service.js?v=20260310-4"></script>
  <script src="app.js?v=20260310-4"></script>
</body>
</html>

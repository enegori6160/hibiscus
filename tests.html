<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hanahana Slot Tests</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { max-width: 900px; margin: 16px auto; padding: 0 12px; }
    .result.pass { color: #16a34a; }
    .result.fail { color: #dc2626; }
    .testlog { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cabinet-panel { margin-top: 6px; }
  </style>
  </head>
<body>
  <h1>Hanahana Slot テスト</h1>
  <p>このページを開くだけで自動テストが走ります。結果は下部に表示されます。</p>

  <div class="slot-container">
    <div class="hibiscus-side" id="hibiscus"></div>
    <div class="slot-machine">
      <div id="reel0" class="reel"></div>
      <div id="reel1" class="reel"></div>
      <div id="reel2" class="reel"></div>
    </div>
    <div class="hibiscus-side" id="hibiscus-right"></div>
  </div>

  <div class="cabinet-panel">
    <div class="panel-left">
      <button id="betButton" class="bet">BET</button>
      <div class="meter"><span>BET：</span><strong id="betCount">0</strong></div>
    </div>
    <div class="panel-center">
      <button id="stop0" class="stop">●</button>
      <button id="stop1" class="stop">●</button>
      <button id="stop2" class="stop">●</button>
    </div>
    <div class="panel-right"><button id="lever" class="lever">⎯⎯</button></div>
  </div>

  <div id="message" class="message"></div>
  <div id="coinDisplay" class="coin">所持コイン：100枚</div>

  <!-- Dummies to satisfy listeners -->
  <button id="spinButton" style="display:none"></button>
  <button id="resetButton" style="display:none"></button>
  <button id="themeToggle" style="display:none"></button>
  <button id="soundToggle" style="display:none"></button>
  <button id="navToggle" style="display:none"></button>
  <nav id="siteNav"></nav>

  <div id="out" class="testlog"></div>

  <script>
    // hook to count SE calls
    window.seCounts = { total:0, coin:0, win:0 };
    window._onPlaySound = (t)=>{ seCounts.total++; if(t==='coin') seCounts.coin++; if(t==='win') seCounts.win++; };
  </script>
  <script src="app.js"></script>
  <script>
    const out = document.getElementById('out');
    const log = (html)=>{ const p = document.createElement('div'); p.className='result'; p.innerHTML=html; out.appendChild(p); };
    const wait = (ms)=> new Promise(r=>setTimeout(r,ms));

    (async function run(){
      const g = window._game;
      let pass=0, fail=0;
      function expect(name, cond){ if(cond){ pass++; log(`<span class='pass'>PASS</span> ${name}`);} else { fail++; log(`<span class='fail'>FAIL</span> ${name}`);} }

      // reset coins/bet
      g.coin = 100; g.bet = 0; seCounts.coin = 0; seCounts.total = 0;

      // 1) 小役（🍒×3）で+4を1枚ずつ
      const c1 = g.coin; g.forceEvaluate(['🍒','🍒','🍒']);
      await wait(400); // 4枚 * 60ms ≈ 240ms 余裕をみて
      expect('Cherry +4', g.coin === c1 + 4);
      expect('Coin SE >= 4', seCounts.coin >= 4);

      // 2) BIG 777 は+350一括（SEはcoin鳴らない）
      const beforeSE = seCounts.coin; const c2 = g.coin; g.forceEvaluate(['7','7','7']);
      await wait(30);
      expect('BIG +350 immediate', g.coin === c2 + 350);
      expect('No coin SE on BIG', seCounts.coin === beforeSE);

      // 3) REG BAR×3 は+120一括
      const c3 = g.coin; const beforeSE2 = seCounts.coin; g.forceEvaluate(['BAR','BAR','BAR']);
      await wait(30);
      expect('REG +120 immediate', g.coin === c3 + 120);
      expect('No coin SE on REG', seCounts.coin === beforeSE2);

      // 4) ハズレ
      const c4 = g.coin; g.forceEvaluate(['🍒','🍒','🍋']);
      await wait(50);
      expect('Miss no change', g.coin === c4);

      log(`<hr><strong>結果: ${pass} pass / ${fail} fail</strong>`);
    })();
  </script>
</body>
</html>
